<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>拼圖小達人 - 日常生活圖卡視覺拼圖訓練</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #18181C;
      --card-border: #FFFF00;
      --text-color: #FFFF00;
      --subtext-color: #FFFFFF;
      --accent-color: #00FF00;
      --panel-bg: #161618;
      --border-color: #444444;
    }

    body.light-theme {
      --bg-color: #F4F6F9;
      --card-bg: #FFFFFF;
      --card-border: #002868;
      --text-color: #002868;
      --subtext-color: #111111;
      --accent-color: #008A00;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* 頂部進度與重聽欄 */
    #top-bar {
      position: fixed;
      top: 14px;
      left: 84px;
      right: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      gap: 10px;
    }

    .top-badges-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #student-badge {
      background: #002868;
      border: 3px solid #00D4FF;
      color: #FFFFFF;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 1.05rem;
      font-weight: 900;
      white-space: nowrap;
      cursor: pointer;
    }

    #level-badge {
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 1.05rem;
      font-weight: 900;
      white-space: nowrap;
    }

    #progress-bar-container {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .progress-dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 3px solid var(--card-border);
      background-color: transparent;
      transition: background-color 0.25s ease, transform 0.25s ease;
    }

    .progress-dot.filled {
      background-color: var(--card-border);
      transform: scale(1.15);
    }

    #replay-audio-btn {
      background: #FFFF00;
      color: #000000;
      border: 3px solid #000000;
      border-radius: 22px;
      padding: 10px 20px;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      white-space: nowrap;
    }

    #replay-audio-btn:active {
      transform: scale(0.95);
    }

    /* 主遊戲區 */
    #main-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 76px 18px 86px 18px;
      gap: 12px;
    }

    #prompt-banner {
      font-size: clamp(1.85rem, 3.8vw, 2.9rem);
      font-weight: 900;
      text-align: center;
      color: var(--text-color);
      letter-spacing: 2px;
      min-height: 1.3em;
    }

    /* 左右分欄工作區：左邊拼圖底板，右邊拼圖塊托盤 */
    #puzzle-workspace {
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      width: 100%;
      max-width: 1200px;
      flex: 1;
      gap: clamp(20px, 4vw, 60px);
    }

    .zone-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .zone-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: #00D4FF;
      letter-spacing: 1px;
    }

    body.light-theme .zone-title {
      color: #002868;
    }

    /* 拼圖底板 */
    #puzzle-board {
      position: relative;
      background-color: var(--card-bg);
      border: 8px solid var(--card-border);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
    }

    #puzzle-board.board-completed {
      border-color: #00FF00 !important;
      box-shadow: 0 0 46px rgba(0, 255, 0, 0.9);
      transform: scale(1.03);
    }

    /* 底板參考底圖 */
    #board-ghost-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /* 底板格線容器 */
    #board-slots-grid {
      position: absolute;
      inset: 0;
      display: grid;
      width: 100%;
      height: 100%;
    }

    .board-slot {
      position: relative;
      border: 3px dashed rgba(255, 255, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    body.light-theme .board-slot {
      border-color: rgba(0, 40, 104, 0.55);
    }

    #puzzle-board.board-completed .board-slot {
      border: none !important;
    }

    .board-slot.slot-hover {
      background-color: rgba(0, 255, 0, 0.25);
      border-color: #00FF00;
    }

    .board-slot.slot-filled {
      border: 2px solid rgba(255, 255, 255, 0.35);
    }

    /* 已歸位拼圖圖像 */
    .snapped-piece-bg {
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      animation: snapPop 0.28s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    @keyframes snapPop {
      0% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    /* 右側待拼圖塊托盤 */
    #pieces-tray {
      background-color: rgba(35, 35, 42, 0.85);
      border: 5px dashed #00D4FF;
      border-radius: 26px;
      padding: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      align-content: center;
      gap: 18px;
      transition: opacity 0.3s ease;
    }

    body.light-theme #pieces-tray {
      background-color: rgba(225, 234, 245, 0.9);
      border-color: #0055B3;
    }

    .tray-slot-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.25);
    }

    /* 可拖拉／點選的拼圖塊 */
    .puzzle-piece {
      border: 5px solid #FFFF00;
      border-radius: 16px;
      background-repeat: no-repeat;
      cursor: grab;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.2s ease;
      position: relative;
      z-index: 10;
    }

    body.light-theme .puzzle-piece {
      border-color: #002868;
    }

    .puzzle-piece.selected-piece {
      border-color: #00FF00 !important;
      box-shadow: 0 0 32px rgba(0, 255, 0, 0.95);
      transform: scale(1.06);
    }

    .puzzle-piece.dragging {
      position: fixed !important;
      z-index: 150 !important;
      cursor: grabbing;
      border-color: #00FF00 !important;
      box-shadow: 0 18px 42px rgba(0, 255, 0, 0.75);
      transform: scale(1.06);
      pointer-events: none;
    }

    /* 底部手動「下一題」按鈕列 */
    #next-question-bar {
      position: fixed;
      bottom: 14px;
      left: 0;
      right: 0;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 30;
      pointer-events: none;
    }

    #next-question-btn {
      pointer-events: auto;
      background: #00FF00;
      color: #000000;
      border: 4px solid #000000;
      border-radius: 26px;
      padding: 12px 44px;
      font-size: clamp(1.4rem, 2.8vw, 2rem);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 26px rgba(0, 255, 0, 0.55);
      letter-spacing: 2px;
    }

    /* 煙花粒子 */
    .particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 60;
    }

    /* 教師設定按鈕（左上角單按 1 下即開啟） */
    #teacher-trigger {
      position: fixed;
      top: 14px;
      left: 14px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(80, 80, 85, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      cursor: pointer;
    }

    #teacher-trigger svg.gear-icon {
      width: 28px;
      height: 28px;
      fill: #FFFFFF;
    }

    /* 啟動與休息遮罩畫面 */
    #start-overlay, #break-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      text-align: center;
      overflow-y: auto;
    }

    #start-overlay *, #break-overlay *, #teacher-panel * {
      touch-action: manipulation;
    }

    .start-subtitle {
      font-size: 1.15rem;
      color: #00D4FF;
      font-weight: 800;
      margin: 4px 0 18px 0;
    }

    /* 開始畫面圖卡預覽列 */
    .builtin-preview-strip {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 820px;
      margin-bottom: 24px;
    }

    .preview-chip {
      background: #1C1C22;
      border: 2px solid #444;
      border-radius: 14px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 82px;
    }

    .preview-chip.high-contrast-chip {
      border-color: #FFFF00;
    }

    .preview-chip img {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
    }

    .preview-chip span {
      font-size: 0.85rem;
      font-weight: 800;
      color: #FFFFFF;
      margin-top: 4px;
    }

    .start-actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }

    .big-start-btn {
      background-color: #FFFF00;
      color: #000000;
      border: none;
      border-radius: 24px;
      padding: 22px 48px;
      font-size: 1.9rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(255, 255, 0, 0.55);
    }

    .big-start-btn:active {
      transform: scale(0.96);
    }

    .secondary-setup-btn {
      background-color: #00D4FF;
      color: #000000;
      border: none;
      border-radius: 24px;
      padding: 22px 32px;
      font-size: 1.4rem;
      font-weight: 900;
      cursor: pointer;
    }

    #break-overlay {
      display: none;
    }

    .trophy-icon {
      font-size: 6rem;
      margin-bottom: 10px;
    }

    .break-title {
      font-size: 2.5rem;
      font-weight: 900;
      color: #FFFF00;
      margin: 8px 0;
    }

    .break-stats {
      background: #1C1C1E;
      border: 2px solid #444;
      border-radius: 16px;
      padding: 18px 32px;
      margin: 18px 0;
      color: #FFFFFF;
      font-size: 1.25rem;
      line-height: 1.8;
    }

    /* 教師設定面板 */
    #teacher-panel {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }

    .panel-card {
      background-color: var(--panel-bg);
      color: #FFFFFF;
      width: 100%;
      max-width: 920px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 20px;
      border: 2px solid var(--border-color);
      padding: 24px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 14px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.4rem;
      color: #FFFF00;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: #252529;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: #00FF00;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #CCCCCC;
      margin-top: 4px;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    .setting-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 1.05rem;
      color: #EFEFEF;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .opt-btn {
      background: #2C2C30;
      color: #FFFFFF;
      border: 2px solid #48484D;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.94rem;
      font-weight: 600;
      cursor: pointer;
    }

    .opt-btn.active {
      background: #FFFF00;
      color: #000000;
      border-color: #FFFF00;
    }

    .custom-upload-box {
      background: #232328;
      border: 2px dashed #00D4FF;
      border-radius: 16px;
      padding: 16px;
      margin-top: 10px;
    }

    .upload-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .file-pick-btn {
      background: #00D4FF;
      color: #000000;
      padding: 11px 18px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 0.98rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .camera-pick-btn {
      background: #FFB800;
      color: #000000;
      padding: 11px 18px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 0.98rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #pending-batch-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .pending-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #16161A;
      border: 2px solid #FFFF00;
      border-radius: 12px;
      padding: 8px 12px;
    }

    .pending-row img {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 8px;
    }

    .pending-row input {
      background: #2A2A30;
      color: #FFFFFF;
      border: 2px solid #666;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 1rem;
      flex: 1;
      user-select: text;
      -webkit-user-select: text;
    }

    #save-batch-btn {
      display: none;
      margin-top: 12px;
      width: 100%;
      background: #00FF00;
      color: #000000;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
    }

    .items-manage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .manage-card {
      background: #2B2B32;
      border: 1px solid #4A4A52;
      border-radius: 12px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      text-align: center;
    }

    .manage-card.hc-card {
      border-color: #FFFF00;
    }

    .manage-card .thumb-box {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .manage-card .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .manage-card .card-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: #FFFFFF;
    }

    .manage-card .card-tag {
      font-size: 0.72rem;
      color: #AAAAAA;
      margin-top: 2px;
    }

    .del-chip-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #FF3B30;
      color: #FFFFFF;
      border: none;
      font-weight: 900;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .action-btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }

    .btn-reset {
      background: #3A3A3C;
      color: #FF6B6B;
    }

    .btn-close {
      background: #00FF00;
      color: #000000;
      flex: 1;
    }
  </style>
</head>
<body>

  <!-- 教師設定按鈕（左上角單按 1 下即開啟） -->
  <div id="teacher-trigger" title="開啟教師設定與難度選項">
    <svg class="gear-icon" viewBox="0 0 24 24">
      <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
    </svg>
  </div>

  <!-- 頂部狀態欄 -->
  <div id="top-bar">
    <div class="top-badges-left">
      <div id="student-badge" title="點擊開啟設定">🎨 全部日常圖卡</div>
      <div id="level-badge">階段 1：左右 2 塊</div>
    </div>
    <div id="progress-bar-container"></div>
    <button id="replay-audio-btn">🔊 再聽一次</button>
  </div>

  <!-- 主遊戲區 -->
  <div id="main-container">
    <div id="prompt-banner">準備開始拼圖</div>
    <div id="puzzle-workspace">
      <div class="zone-wrapper">
        <div class="zone-title">拼圖底板（拖拉或點選放入）</div>
        <div id="puzzle-board">
          <img id="board-ghost-img" src="" alt="" />
          <div id="board-slots-grid"></div>
        </div>
      </div>

      <div class="zone-wrapper" id="tray-wrapper">
        <div class="zone-title">待拼圖塊</div>
        <div id="pieces-tray"></div>
      </div>
    </div>
  </div>

  <!-- 底部手動「下一題」按鈕列 -->
  <div id="next-question-bar">
    <button id="next-question-btn">➡️ 下一題</button>
  </div>

  <!-- 啟動畫面：直接一按即玩，無需預先上傳 -->
  <div id="start-overlay">

    // === 狀態儲存 ===

    let state = {
      customItems: [],
      settings: {
        poolFilter: 'all', // all | high | natural
        cutMode: 'auto',
        currentCut: 'lr2',
        streakAtLevel: 0,
        ghostOpacity: '0.28',
        manualNext: false,
        theme: 'dark',
        roundLimit: 8
      },
      stats: {
        totalCompleted: 0
      }
    };

    let pendingBatchItems = [];

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.customItems) state.customItems = parsed.customItems;
          if (parsed.settings) state.settings = { ...state.settings, ...parsed.settings };
          if (parsed.stats) state.stats = { ...state.stats, ...parsed.stats };
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        alert('瀏覽器儲存空間已滿，請先刪除部分自訂相片。');
      }
    }

    function getActiveItemPool() {
      const customTagged = state.customItems.map(item => ({ ...item, contrast: 'custom' }));
      if (state.settings.poolFilter === 'high') {
        return [...BUILTIN_PUZZLE_ITEMS.filter(i => i.contrast === 'high'), ...customTagged];
      }
      if (state.settings.poolFilter === 'natural') {
        return [...BUILTIN_PUZZLE_ITEMS.filter(i => i.contrast === 'natural'), ...customTagged];
      }
      return [...BUILTIN_PUZZLE_ITEMS, ...customTagged];

    // === Web Audio API 音效 ===
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSnapSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.setValueAtTime(880, now + 0.06);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.22);
    }

    function playCompleteSound() {
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const now = audioCtx.currentTime + idx * 0.06;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      });
    }

    function playGentleNudgeSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.linearRampToValueAtTime(250, now + 0.2);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.22);
    }

    function loadCantoneseVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      cantoneseVoice =
        voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
        voices.find(v => v.lang.toLowerCase().includes('hk') || v.name.toLowerCase().includes('cantonese') || v.name.includes('粵語') || v.name.includes('廣東話')) ||
        null;
    }

      loadCantoneseVoice();
      window.speechSynthesis.onvoiceschanged = loadCantoneseVoice;
    }

    function clearSpeechQueue() {
      speechSeqTimers.forEach(t => clearTimeout(t));
      speechSeqTimers = [];
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function speakSingleUtterance(text, pitch = 1.12, rate = 0.86) {
      if (!('speechSynthesis' in window) || !text) return;
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
      const utter = new SpeechSynthesisUtterance(String(text));
      utter.lang = 'zh-HK';
      if (cantoneseVoice) utter.voice = cantoneseVoice;
      utter.rate = rate;
      utter.pitch = pitch;
      currentUtteranceRef = utter;
      utter.onend = () => { if (currentUtteranceRef === utter) currentUtteranceRef = null; };
      window.speechSynthesis.speak(utter);
    }

    function speakCantonese(text, pitch = 1.12) {
      clearSpeechQueue();
      const t = setTimeout(() => speakSingleUtterance(text, pitch, 0.86), 60);
      speechSeqTimers.push(t);
    }

    function speakSequence(segments) {
      clearSpeechQueue();
      let delay = 60;
      segments.forEach(seg => {
        const t = setTimeout(() => {
          speakSingleUtterance(seg.text, seg.pitch || 1.14, seg.rate || 0.85);
        }, delay);
        speechSeqTimers.push(t);
        delay += seg.pauseAfter || 950;
      });
    }

    // === 產生拼圖題目 ===
    function generatePuzzle() {
      if (runtime.isPaused) return;
      clearAutoTimer();
      nextQuestionBar.style.display = 'none';

      const items = getActiveItemPool();
      const s = state.settings;

      if (s.cutMode !== 'auto') {
        s.currentCut = s.cutMode;
      }

      const cutConfig = {
        lr2: { rows: 1, cols: 2 },
        tb2: { rows: 2, cols: 1 },
        grid4: { rows: 2, cols: 2 },
        grid9: { rows: 3, cols: 3 }
      }[s.currentCut] || { rows: 1, cols: 2 };

      runtime.rows = cutConfig.rows;
      runtime.cols = cutConfig.cols;
      runtime.totalPieces = runtime.rows * runtime.cols;
      runtime.snappedCount = 0;
      runtime.selectedPieceId = null;
      runtime.isCompleted = false;
      runtime.pendingRoundBreak = false;

      updateHeaderUI();

      const candidates = items.length > 1
        ? items.filter(i => i.id !== runtime.lastTargetId)
        : items;
      const target = candidates[Math.floor(Math.random() * candidates.length)];
      runtime.targetItem = target;
      runtime.lastTargetId = target.id;

      promptBanner.textContent = `拼返好個「${target.name}」呀！`;
      speakCantonese(`拼返好個${target.name}呀！`, 1.12);

      const boardSize = Math.round(Math.min(window.innerWidth * 0.42, window.innerHeight * 0.62, 460));
      puzzleBoard.classList.remove('board-completed');
      puzzleBoard.style.width = `${boardSize}px`;
      puzzleBoard.style.height = `${boardSize}px`;

      boardGhostImg.src = target.imageUrl;
      boardGhostImg.style.opacity = s.ghostOpacity;

      boardSlotsGrid.style.gridTemplateRows = `repeat(${runtime.rows}, 1fr)`;
      boardSlotsGrid.style.gridTemplateColumns = `repeat(${runtime.cols}, 1fr)`;
      boardSlotsGrid.innerHTML = '';

      const pieceWidth = Math.floor(boardSize / runtime.cols);
      const pieceHeight = Math.floor(boardSize / runtime.rows);

      const indices = [];
      for (let idx = 0; idx < runtime.totalPieces; idx++) {
        indices.push(idx);
        const slot = document.createElement('div');
        slot.className = 'board-slot';
        slot.dataset.slotIndex = String(idx);

        slot.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          if (runtime.isCompleted || runtime.selectedPieceId === null) return;
          if (slot.classList.contains('slot-filled')) return;

          if (Number(runtime.selectedPieceId) === idx) {
            const pieceEl = document.querySelector(`.puzzle-piece[data-piece-index="${idx}"]`);
            snapPieceToSlot(pieceEl, slot, idx, boardSize, pieceWidth, pieceHeight);
          } else {
            playGentleNudgeSound();
          }
        });

        boardSlotsGrid.appendChild(slot);
      }

      piecesTray.style.width = `${boardSize + 36}px`;
      piecesTray.style.minHeight = `${boardSize}px`;
      piecesTray.innerHTML = '';

      let shuffled = [...indices].sort(() => Math.random() - 0.5);
      if (shuffled.length > 1 && shuffled.every((v, i) => v === i)) {
        shuffled = shuffled.reverse();
      }

      const trayScale = runtime.totalPieces === 9 ? 0.78 : 0.86;
      const trayPieceW = Math.floor(pieceWidth * trayScale);
      const trayPieceH = Math.floor(pieceHeight * trayScale);

      shuffled.forEach(pieceIdx => {
        const r = Math.floor(pieceIdx / runtime.cols);
        const c = pieceIdx % runtime.cols;

        const holder = document.createElement('div');
        holder.className = 'tray-slot-placeholder';
        holder.style.width = `${trayPieceW}px`;
        holder.style.height = `${trayPieceH}px`;

        const piece = document.createElement('div');
        piece.className = 'puzzle-piece';
        piece.dataset.pieceIndex = String(pieceIdx);
        piece.style.width = `${trayPieceW}px`;
        piece.style.height = `${trayPieceH}px`;
        piece.style.backgroundImage = `url('${target.imageUrl}')`;
        piece.style.backgroundSize = `${trayPieceW * runtime.cols}px ${trayPieceH * runtime.rows}px`;
        piece.style.backgroundPosition = `-${c * trayPieceW}px -${r * trayPieceH}px`;

        attachDragAndTapHandlers(piece, holder, pieceIdx, boardSize, pieceWidth, pieceHeight, trayPieceW, trayPieceH);

        holder.appendChild(piece);
        piecesTray.appendChild(holder);
      });
    }

    function attachDragAndTapHandlers(piece, holder, pieceIdx, boardSize, pieceWidth, pieceHeight, trayPieceW, trayPieceH) {
      let isDragging = false;
      let hasMoved = false;
      let startX = 0;
      let startY = 0;

      piece.addEventListener('pointerdown', (e) => {
        if (runtime.isCompleted || runtime.isPaused) return;
        e.preventDefault();
        piece.setPointerCapture(e.pointerId);

        isDragging = true;
        hasMoved = false;
        startX = e.clientX;
        startY = e.clientY;

        document.querySelectorAll('.puzzle-piece').forEach(p => p.classList.remove('selected-piece'));
        piece.classList.add('selected-piece');
        runtime.selectedPieceId = pieceIdx;
      });

      piece.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (!hasMoved && Math.hypot(dx, dy) > 8) {
          hasMoved = true;
          piece.classList.add('dragging');
          piece.style.width = `${pieceWidth}px`;
          piece.style.height = `${pieceHeight}px`;
          const r = Math.floor(pieceIdx / runtime.cols);
          const c = pieceIdx % runtime.cols;
          piece.style.backgroundSize = `${boardSize}px ${boardSize}px`;
          piece.style.backgroundPosition = `-${c * pieceWidth}px -${r * pieceHeight}px`;
        }

        if (hasMoved) {
          piece.style.left = `${e.clientX - pieceWidth / 2}px`;
          piece.style.top = `${e.clientY - pieceHeight / 2}px`;

          const targetSlot = document.querySelector(`.board-slot[data-slot-index="${pieceIdx}"]`);
          if (targetSlot && !targetSlot.classList.contains('slot-filled')) {
            const slotRect = targetSlot.getBoundingClientRect();
            const slotCx = slotRect.left + slotRect.width / 2;
            const slotCy = slotRect.top + slotRect.height / 2;
            const dist = Math.hypot(e.clientX - slotCx, e.clientY - slotCy);
            const snapRadius = Math.max(pieceWidth, pieceHeight) * 0.65;
            targetSlot.classList.toggle('slot-hover', dist <= snapRadius);
          }
        }
      });

      const endDrag = (e) => {
        if (!isDragging) return;
        isDragging = false;
        piece.classList.remove('dragging');

        const targetSlot = document.querySelector(`.board-slot[data-slot-index="${pieceIdx}"]`);
        if (targetSlot) targetSlot.classList.remove('slot-hover');

        if (hasMoved && targetSlot && !targetSlot.classList.contains('slot-filled')) {
          const slotRect = targetSlot.getBoundingClientRect();
          const slotCx = slotRect.left + slotRect.width / 2;
          const slotCy = slotRect.top + slotRect.height / 2;
          const dist = Math.hypot(e.clientX - slotCx, e.clientY - slotCy);
          const snapRadius = Math.max(pieceWidth, pieceHeight) * 0.68;

          if (dist <= snapRadius) {
            snapPieceToSlot(piece, targetSlot, pieceIdx, boardSize, pieceWidth, pieceHeight);
            return;
          }
        }

        piece.style.left = '';
        piece.style.top = '';
        piece.style.width = `${trayPieceW}px`;
        piece.style.height = `${trayPieceH}px`;
        const r = Math.floor(pieceIdx / runtime.cols);
        const c = pieceIdx % runtime.cols;
        piece.style.backgroundSize = `${trayPieceW * runtime.cols}px ${trayPieceH * runtime.rows}px`;
        piece.style.backgroundPosition = `-${c * trayPieceW}px -${r * trayPieceH}px`;
      };

      piece.addEventListener('pointerup', endDrag);
      piece.addEventListener('pointercancel', endDrag);
    }

    function snapPieceToSlot(pieceEl, slotEl, pieceIdx, boardSize, pieceWidth, pieceHeight) {
      if (slotEl.classList.contains('slot-filled')) return;

      playSnapSound();
      if (navigator.vibrate) navigator.vibrate(45);

      if (pieceEl) pieceEl.remove();
      runtime.selectedPieceId = null;

      const r = Math.floor(pieceIdx / runtime.cols);
      const c = pieceIdx % runtime.cols;

      slotEl.classList.add('slot-filled');
      const filledBg = document.createElement('div');
      filledBg.className = 'snapped-piece-bg';
      filledBg.style.backgroundImage = `url('${runtime.targetItem.imageUrl}')`;
      filledBg.style.backgroundSize = `${boardSize}px ${boardSize}px`;
      filledBg.style.backgroundPosition = `-${c * pieceWidth}px -${r * pieceHeight}px`;
      slotEl.appendChild(filledBg);

      runtime.snappedCount += 1;

      if (runtime.snappedCount >= runtime.totalPieces) {
        handlePuzzleCompleted();
      }
    }

    function handlePuzzleCompleted() {
      runtime.isCompleted = true;
      puzzleBoard.classList.add('board-completed');
      boardGhostImg.style.opacity = '1';

      const rect = puzzleBoard.getBoundingClientRect();
      spawnCelebrationParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
      playCompleteSound();
      if (navigator.vibrate) navigator.vibrate(80);

      const s = state.settings;
      state.stats.totalCompleted += 1;
      runtime.roundCompleted += 1;
      s.streakAtLevel += 1;

      if (s.cutMode === 'auto' && s.streakAtLevel >= 3) {
        if (s.currentCut === 'lr2') {
          s.currentCut = 'tb2';
          s.streakAtLevel = 0;
        } else if (s.currentCut === 'tb2') {
          s.currentCut = 'grid4';
          s.streakAtLevel = 0;
        }
      }

      const praises = ['好叻喎！', '拼得好靚！'];
      const praiseWord = praises[praiseToggle % praises.length];
      praiseToggle += 1;

      promptBanner.textContent = `${praiseWord} ${runtime.targetItem.name}`;
      speakSequence([
        { text: praiseWord, pitch: 1.18, rate: 0.92, pauseAfter: 900 },
        { text: runtime.targetItem.name, pitch: 1.15, rate: 0.82, pauseAfter: 1200 }
      ]);

      saveState();
      updateHeaderUI();
      updateStatsUI();

      const isEndOfRound = (s.roundLimit > 0 && runtime.roundCompleted >= s.roundLimit);
      runtime.pendingRoundBreak = isEndOfRound;

      if (s.manualNext) {
        nextQuestionBtn.textContent = isEndOfRound ? '🏆 完成本回合' : '➡️ 下一題';
        nextQuestionBar.style.display = 'flex';
      } else {
        runtime.autoAdvanceTimer = setTimeout(() => {
          if (isEndOfRound) {
            showRoundBreak();
          } else {
            generatePuzzle();
          }
        }, 3200);
      }
    }

    function spawnCelebrationParticles(cx, cy) {
      const colors = ['#FFFF00', '#00FF00', '#FF3366', '#00D4FF'];
      for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = 14 + Math.random() * 14;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.backgroundColor = colors[i % colors.length];
        p.style.left = `${cx}px`;
        p.style.top = `${cy}px`;
        document.body.appendChild(p);

        const angle = (Math.PI * 2 * i) / 20;
        const dist = 100 + Math.random() * 160;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;

        p.animate([
          { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
          { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0.2)`, opacity: 0 }
        ], {
          duration: 650,
          easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
        }).onfinish = () => p.remove();
      }
    }

    // === 額外選配相片上傳與圖卡管理 ===
    function compressImageFile(file, maxSize = 520) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxSize) {
              h = Math.round((h * maxSize) / w);
              w = maxSize;
            } else if (h >= w && h > maxSize) {
              w = Math.round((w * maxSize) / h);
              h = maxSize;
            }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.84));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleIncomingFiles(fileList) {
      const files = Array.from(fileList || []);
      for (const file of files) {
        const dataUrl = await compressImageFile(file, 520);
        let baseName = file.name.replace(/\.[^/.]+$/, '');
        if (/^(IMG|DSC|PXL|Screenshot|image)_?\d*/i.test(baseName)) baseName = '';
        pendingBatchItems.push({ name: baseName, imageUrl: dataUrl });
      }
      renderPendingBatchList();
    }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
      }
      document.getElementById('start-overlay').style.display = 'none';
      runtime.isPaused = false;
      generatePuzzle();
    });

    applySettingsUI();
    renderStartPreview();
  </script>
</body>
